<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Guia de Inglês</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: one narrow column, bottom tab bar. Flashcards are order tickets (comanda) with a perforated divider. */
:root{
  --bg:#F2F5F1; --paper:#FCFDFB; --ink:#18221D; --ink2:#55645C; --line:#D5DDD6;
  --accent:#2B6B58; --accent-ink:#FFFFFF; --accent-soft:#DAEAE3;
  --warn:#A8620E; --warn-soft:#F5E6D0; --bad:#B03A2E; --bad-soft:#F6DCD8;
  --shadow:rgba(24,34,29,.16);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121714; --paper:#1A211D; --ink:#E7EEE9; --ink2:#9AA8A0; --line:#2B352F;
    --accent:#6FBFA4; --accent-ink:#0E1A15; --accent-soft:#1F3A31;
    --warn:#E0A04A; --warn-soft:#3A2D18; --bad:#EE8576; --bad-soft:#3A1F1B;
    --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121714; --paper:#1A211D; --ink:#E7EEE9; --ink2:#9AA8A0; --line:#2B352F;
  --accent:#6FBFA4; --accent-ink:#0E1A15; --accent-soft:#1F3A31;
  --warn:#E0A04A; --warn-soft:#3A2D18; --bad:#EE8576; --bad-soft:#3A1F1B;
  --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:620px;margin-inline:auto;padding-inline:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 6px}
.brand{font:700 24px/1 var(--f-display);letter-spacing:-.02em;font-variation-settings:"opsz" 60}
.brand small{display:block;margin-top:6px;font:500 12px/1.2 var(--f-body);letter-spacing:.02em;color:var(--ink2)}
.chip{font:500 12px/1 var(--f-mono);padding:7px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
main{padding-block:8px 112px}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
h2.sec{margin:30px 0 12px;font:500 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
h1,h2,h3{text-wrap:balance}
.muted{color:var(--ink2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.spk{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--accent)}
.spk.big{width:84px;height:84px;background:var(--accent-soft);border-color:transparent}
.spk.big svg{width:38px;height:38px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{flex:1;min-height:42px;border:0;background:transparent;padding:0 8px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
select,input[type=text],input[type=search]{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}

/* bars */
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.bar.thick{height:10px;border-radius:5px}
.bar i{display:block;height:100%}
.bar .m{background:var(--accent)}
.bar .l{background:var(--warn)}

/* hero ticket */
.hero,.ticket{position:relative;background:var(--paper);border-radius:6px;box-shadow:0 1px 0 var(--line),0 14px 28px -18px var(--shadow)}
.hero{padding:20px;margin-top:10px}
.goalrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.big{font:700 68px/0.95 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 90}
.of{font-size:15px;color:var(--ink2)}
.perf{position:relative;border-top:2px dashed var(--line);margin:18px -20px}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.perf::before{left:-9px}.perf::after{right:-9px}
.pend{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.pend b{font:600 22px var(--f-mono)}

/* stats */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.trio b{display:block;font:600 28px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.trio span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.m{background:var(--accent)}.dot.l{background:var(--warn)}
.act{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:96px;align-items:stretch}
.act .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.act .col i{display:block;width:100%;max-width:22px;min-height:3px;border-radius:2px;background:var(--line)}
.act .col i.on{background:var(--accent);opacity:.55}
.act .col.today i.on{opacity:1}
.act .col span{font:400 10px/1 var(--f-mono);color:var(--ink2)}
.act .col.today span{color:var(--ink);font-weight:500}

/* categories */
.cat{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:13px 0 14px}
.cat .r{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;align-items:baseline}
.cat .r span:first-child{min-width:0;font-weight:500}
.cat .r span:last-child{font:400 12px var(--f-mono);color:var(--ink2);white-space:nowrap}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.mode{text-align:left;padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:4px}
.mode b{font:600 17px var(--f-display)}
.mode span{font-size:13px;color:var(--ink2);line-height:1.35}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode[aria-pressed="true"] b{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label,.field .lbl{font-size:13px;font-weight:600}
.note{font-size:14px;color:var(--ink2);margin-top:10px}

/* list */
.filters{display:grid;gap:10px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row .num{font:400 11px var(--f-mono);color:var(--ink2);width:34px}
.row .tx{min-width:0}
.row .tx b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .tx span{display:block;color:var(--accent);overflow-wrap:anywhere}
.row .end{display:flex;align-items:center;gap:10px}
.count{font:400 12px var(--f-mono);color:var(--ink2);margin:14px 0 4px}

/* session */
.sess{min-height:100%;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
.s-top{display:flex;align-items:center;gap:12px}
.s-prog{flex:1}
.s-count{font:500 13px var(--f-mono);color:var(--ink2);min-width:44px;text-align:right}
.s-mode{font:500 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.ticket{padding:16px 20px 20px;margin-top:4px}
.tk-h{display:flex;justify-content:space-between;gap:12px;font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.tk-h span:last-child{text-align:right}
.tk-front{padding:22px 0 4px;min-height:96px;font:650 clamp(30px,9vw,42px)/1.08 var(--f-display);letter-spacing:-.015em;overflow-wrap:anywhere;text-wrap:balance}
.tk-front.long,.tk-back.long{font-size:clamp(22px,6vw,28px);line-height:1.2}
.tk-zone{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tk-back{padding:6px 0 0;min-height:70px;font:650 clamp(28px,8vw,38px)/1.1 var(--f-display);letter-spacing:-.015em;color:var(--accent);overflow-wrap:anywhere;text-wrap:balance;flex:1;min-width:0}
.tk-wait{padding-top:14px;min-height:70px;color:var(--ink2);font-size:15px}
.tk-center{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 0 8px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:54px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--bg);font:500 12px var(--f-mono);color:var(--ink2)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.good{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{padding:12px 14px;border-radius:8px;font-weight:500}
.fb.ok{background:var(--accent-soft);color:var(--accent)}
.fb.near{background:var(--warn-soft);color:var(--warn)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb b{font-weight:700}
.ans{font-size:20px;min-height:54px}
.res .big{font-size:76px}
.set{display:grid;gap:16px}
.set .lbl{font-size:14px;font-weight:600;margin-bottom:6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:620px;margin-inline:auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;padding:8px 4px 6px;border:0;background:transparent;font-size:12px;font-weight:600;color:var(--ink2);border-top:2px solid transparent}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .opt,.btn,.mode,.chips button{transition:background-color .12s,border-color .12s}
}
</style>

  </nav>
</div>

function $(s,r){return (r||document).querySelector(s)}

function pad(n){return String(n).padStart(4,'0')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- state ---------- */
function fix(o){
  o=o&&typeof o==='object'?o:{};
  var op=Object.assign({goal:20,dir:'pt',auto:true,slow:false},o.o||{});
  return {v:1,t:+o.t||0,s:o.s&&typeof o.s==='object'?o.s:{},d:o.d&&typeof o.d==='object'?o.d:{},o:op};
}
function loadLocal(){
  try{var raw=localStorage.getItem(KEY);if(raw)return fix(JSON.parse(raw))}catch(e){}
  return fix({});
}
var state=loadLocal();
function pruneDays(){
  var t=today();
  Object.keys(state.d).forEach(function(k){if(+k<t-120)delete state.d[k]});
}

/* ---------- sync (private per-viewer db doc, local fallback) ---------- */
var progRef=null,timer=0,writing=false,pending=false,sync='local';
function setSync(v){
  sync=v;
  var el=$('#syncnote');
  if(el)el.textContent=v==='cloud'?'Seu progresso é salvo na sua conta e acompanha você em outros aparelhos.':'Seu progresso é salvo só neste aparelho.';
}
function persist(){
  state.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(progRef){clearTimeout(timer);timer=setTimeout(flush,1500)}
}
function snapshot(){pruneDays();return {v:1,t:state.t,s:state.s,d:state.d,o:state.o}}
function flush(){
  if(!progRef)return;
  if(writing){pending=true;return}
  writing=true;
  progRef.set(snapshot()).then(function(){setSync('cloud')},function(){setSync('local')}).then(function(){
    writing=false;
    if(pending){pending=false;flush()}
  });
}
function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];
      if(!db||!user)return null;
      return user.id().then(function(uid){
        if(!uid)return null;
        progRef=db.doc('data/users/'+uid+'/progress');
        return progRef.get().then(function(snap){
          if(snap.exists){
            var remote=snap.data()||{};
            if((+remote.t||0)>state.t){
              state=fix(remote);
              try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
              if(!SES)render();
            }else if(state.t>(+remote.t||0)){flush()}
          }else if(state.t>0){flush()}
          setSync('cloud');
        });
      });
    }).catch(function(){setSync('local')});
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){clearTimeout(timer);flush()}});

var TTS=false,voice=null;
try{TTS=('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined'}catch(e){}
function pickVoice(){
  if(!TTS)return;
  try{
    var vs=speechSynthesis.getVoices();
    voice=vs.find(function(v){return /^en[-_]US/i.test(v.lang)})||vs.find(function(v){return /^en/i.test(v.lang)})||null;
  }catch(e){}
}
if(TTS){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function speakable(en){return en.replace(/\s*\([^)]*\)/g,'').split('/')[0].trim()}
function speak(en){
  if(!TTS)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(speakable(en));
    u.lang='en-US';if(voice)u.voice=voice;
    u.rate=state.o.slow?0.65:0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

  if(!TTS)return '';
  return '<button class="spk'+(big?' big':'')+'" data-act="speak" data-n="'+n+'" aria-label="Ouvir em inglês">'+ICON.spk+'</button>';
}

/* ---------- matching helpers ---------- */
function norm(s){return s.toLowerCase().replace(/[‘’`]/g,"'").replace(/'/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function variants(en){
  var out=[];
  function add(s){var k=norm(s);if(k&&out.indexOf(k)<0)out.push(k)}
  var np=en.replace(/\s*\([^)]*\)/g,'');
  add(en);add(np);
  np.split('/').forEach(function(p){p=p.trim();add(p);if(/^to /i.test(p))add(p.replace(/^to /i,''))});
  return out;
}
function lev(a,b){
  var m=a.length,n=b.length,i,j,prev=[],cur;
  for(j=0;j<=n;j++)prev[j]=j;
  for(i=1;i<=m;i++){
    cur=[i];
    for(j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function checkWrite(n,input){
  var a=norm(input);
  if(!a)return null;
  var vs=variants(W[n-1][1]);
  if(vs.indexOf(a)>=0)return 'ok';
  for(var i=0;i<vs.length;i++){
    var v=vs[i];
    if(v.length>=5&&lev(a,v)<=(v.length>=12?2:1))return 'near';
  }
  return 'no';
}
function clash(a,b){
  if(norm(W[a-1][0])===norm(W[b-1][0]))return true;
  var va=variants(W[a-1][1]),vb=variants(W[b-1][1]);
  return va.some(function(x){return vb.indexOf(x)>=0});
}
function makeOptions(n,field){
  var correct=W[n-1][field];
  var cands=[],i;
  for(i=1;i<=N;i++){if(i!==n&&catOf(i)===catOf(n))cands.push(i)}
  var far=[];
  for(i=1;i<=N;i++){if(catOf(i)!==catOf(n))far.push(i)}
  cands=cands.concat(shuffle(far).slice(0,30));
  cands=shuffle(cands).map(function(c){return {c:c,k:Math.abs(W[c-1][field].length-correct.length)+Math.random()*8}}).sort(function(a,b){return a.k-b.k});
  var picked=[],seen={};
  seen[correct]=1;
  for(i=0;i<cands.length&&picked.length<3;i++){
    var c=cands[i].c,t=W[c-1][field];
    if(seen[t]||clash(n,c))continue;
    var bad=picked.some(function(p){return clash(p,c)});
    if(bad)continue;
    seen[t]=1;picked.push(c);
  }
  var opts=picked.map(function(c){return {t:W[c-1][field],ok:false}});
  opts.push({t:correct,ok:true});
  return shuffle(opts);
}

/* ---------- spaced repetition ---------- */
function newToday(){var r=state.d[today()];return r?r[1]:0}
function grade(n,ok){
  var t=today(),r=state.s[n],isNew=!r;
  if(!r)r=[0,t,0,0];
  if(ok){r[0]=Math.min(r[0]+1,6);r[1]=t+INT[r[0]];r[2]++}
  else{r[0]=Math.max(0,r[0]-2);r[1]=t;r[3]++}
  state.s[n]=r;
  var d=state.d[t]||(state.d[t]=[0,0]);
  d[0]++;if(isNew)d[1]++;
  persist();
}
function stats(cat){
  var t=today(),m=0,l=0,nw=0,due=0,n,r;
  for(n=1;n<=N;n++){
    if(cat!=null&&catOf(n)!==cat)continue;
    r=state.s[n];
    if(!r)nw++;
    else{if(r[0]>=4)m++;else l++;if(r[1]<=t)due++}
  }
  return {m:m,l:l,nw:nw,due:due,total:m+l+nw};
}
function streak(){
  var t=today(),c=0;
  if(!(state.d[t]&&state.d[t][0]))t--;
  while(state.d[t]&&state.d[t][0]){c++;t--}
  return c;
}
function buildQueue(pool,cat,size){
  var t=today(),ids=[],n;
  for(n=1;n<=N;n++){if(cat==='all'||catOf(n)===+cat)ids.push(n)}
  var seen=ids.filter(function(x){return state.s[x]}),unseen=ids.filter(function(x){return !state.s[x]});
  var due=seen.filter(function(x){return state.s[x][1]<=t}).sort(function(a,b){return state.s[a][1]-state.s[b][1]||state.s[a][0]-state.s[b][0]});
  size=size||20;
  if(pool==='hoje'){
    var q=due.slice(0,30);
    var room=Math.max(0,Math.min(state.o.goal-newToday(),40-q.length));
    return q.concat(unseen.slice(0,room));
  }
  if(pool==='novas')return unseen.slice(0,size);
  if(pool==='vistas'){
    var dueSet={};due.forEach(function(x){dueSet[x]=1});
    var rest=seen.filter(function(x){return !dueSet[x]});
    return shuffle(due).concat(shuffle(rest)).slice(0,size);
  }
  return shuffle(ids).slice(0,size);
}

    h+='<div><div class="lbl">Velocidade da voz</div><div class="seg" role="group"><button data-act="slow" data-v="0" aria-pressed="'+!state.o.slow+'">Normal</button><button data-act="slow" data-v="1" aria-pressed="'+state.o.slow+'">Devagar</button></div></div>';
  }
  h+='<div>'+(resetArm?'<div class="note" style="margin:0 0 10px">Isso apaga todo o seu progresso.</div><div class="two"><button class="btn ghost" data-act="reset-no">Cancelar</button><button class="btn bad" data-act="reset-yes">Apagar tudo</button></div>':'<button class="btn ghost block" data-act="reset-ask">Zerar progresso</button>')+'</div>';
  h+='<p class="note" id="syncnote" style="margin:0"></p></div>';
  return h;
}

/* ---------- practice ---------- */
function practiceHTML(){
  var h='<h2 class="sec">Como você quer estudar?</h2><div class="modes">';
  Object.keys(MODES).forEach(function(k){
    if(k==='listen'&&!TTS)return;
    h+='<button class="mode" data-act="mode" data-m="'+k+'" aria-pressed="'+(cfg.mode===k)+'"><b>'+MODES[k].n+'</b><span>'+MODES[k].d+'</span></button>';
  });
  h+='</div>';
  h+='<div class="field"><label for="sel-cat">Assunto</label><select id="sel-cat"><option value="all">Todos os assuntos</option>';
  CATS.forEach(function(n,c){h+='<option value="'+c+'"'+(String(cfg.cat)===String(c)?' selected':'')+'>'+esc(n)+'</option>'});
  h+='</select></div>';
  h+='<div class="field"><label for="sel-pool">Quais palavras</label><select id="sel-pool">';
  Object.keys(POOLS).forEach(function(k){h+='<option value="'+(k==='todas'?'tudo':k)+'"'+((k==='todas'?'tudo':k)===cfg.pool?' selected':'')+'>'+POOLS[k]+'</option>'});
  h+='</select></div>';
  if(cfg.mode==='cards'){
    h+='<div class="field"><span class="lbl">Frente do cartão</span><div class="seg" role="group"><button data-act="dir" data-d="pt" aria-pressed="'+(state.o.dir==='pt')+'">Português</button><button data-act="dir" data-d="en" aria-pressed="'+(state.o.dir==='en')+'">Inglês</button></div></div>';
  }
  var q=buildQueue(cfg.pool,cfg.cat,20);
  h+='<div style="margin-top:22px"><button class="btn pri block" data-act="start"'+(q.length?'':' disabled')+'>'+(q.length?'Começar ('+q.length+' palavras)':'Nada para estudar aqui')+'</button></div>';
  if(!q.length){
    h+='<p class="note">'+(cfg.pool==='hoje'?'A meta de hoje está cumprida e não há revisões pendentes. Escolha “Só palavras novas” para avançar.':cfg.pool==='novas'?'Você já viu todas as palavras deste assunto.':cfg.pool==='vistas'?'Você ainda não viu palavras deste assunto.':'Nenhuma palavra encontrada.')+'</p>';
  }else if(cfg.pool==='hoje'){
    h+='<p class="note">Revisões vencidas primeiro, depois palavras novas até a meta do dia.</p>';
  }
  return h;
}

/* ---------- list ---------- */
function listRows(){
  var q=fold(L.q.trim()),out=[],n;
  for(n=1;n<=N;n++){
    if(L.cat!=='all'&&catOf(n)!==+L.cat)continue;
    var s=statusOf(n);
    if(L.st!=='all'&&s!==L.st)continue;
    if(q&&fold(W[n-1][0]).indexOf(q)<0&&fold(W[n-1][1]).indexOf(q)<0)continue;
    out.push(n);
  }
  var h='<div class="count">'+out.length+(out.length===1?' palavra':' palavras')+'</div>';
  out.slice(0,L.shown).forEach(function(n){
    var s=statusOf(n);
    h+='<div class="row"><span class="num">'+pad(n)+'</span><div class="tx"><b>'+esc(W[n-1][0])+'</b><span>'+esc(W[n-1][1])+'</span></div><div class="end"><i class="dot '+(s==='n'?'':s)+'" title="'+(s==='m'?'Dominada':s==='l'?'Aprendendo':'Nova')+'"></i>'+spkBtn(n,false)+'</div></div>';
  });
  if(out.length>L.shown)h+='<div style="padding-top:14px"><button class="btn ghost block" data-act="more">Mostrar mais</button></div>';
  return h;
}
function listHTML(){
  var h='<div class="filters"><input type="search" id="q" placeholder="Buscar em português ou inglês" aria-label="Buscar" value="'+esc(L.q)+'" autocomplete="off">';
  h+='<select id="lcat" aria-label="Assunto"><option value="all">Todos os assuntos</option>';
  CATS.forEach(function(n,c){h+='<option value="'+c+'"'+(String(L.cat)===String(c)?' selected':'')+'>'+esc(n)+'</option>'});
  h+='</select><div class="chips">';
  [['all','Todas'],['n','Novas'],['l','Aprendendo'],['m','Dominadas']].forEach(function(x){h+='<button data-act="lst" data-s="'+x[0]+'" aria-pressed="'+(L.st===x[0])+'">'+x[1]+'</button>'});
  h+='</div></div><div id="rows">'+listRows()+'</div>';
  return h;
}

/* ---------- render ---------- */
function render(){
  var app=$('#app'),h;
  if(view==='home')h=homeHTML();else if(view==='practice')h=practiceHTML();else h=listHTML();
  app.innerHTML=h;
  document.querySelectorAll('.tabs button').forEach(function(b){
    if(b.dataset.v===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  var s=streak();
  $('#streak').textContent=s>0?s+(s===1?' dia seguido':' dias seguidos'):'Comece hoje';
  setSync(sync);
}
function setView(v){view=v;resetArm=false;render();window.scrollTo(0,0)}

/* ---------- session ---------- */
function startSession(mode,pool,cat,size){
  var q=buildQueue(pool,cat,size);
  if(!q.length)return false;
  SES={mode:mode,pool:pool,cat:cat,size:size,queue:q.slice(),total:q.length,i:0,phase:'q',done:{},ndone:0,right:0,wrong:[],requeued:{},graded:{},ngraded:0,cur:null};
  $('#shell').hidden=true;$('#session').hidden=false;
  window.scrollTo(0,0);
  draw();
  return true;
}
function endSession(){
  SES=null;
  try{if(TTS)speechSynthesis.cancel()}catch(e){}
  $('#session').hidden=true;$('#shell').hidden=false;
  clearTimeout(timer);flush();
  render();window.scrollTo(0,0);
}
function tkHead(n){return '<div class="tk-h"><span>Nº '+pad(n)+'</span><span>'+esc(CATS[catOf(n)])+'</span></div>'}
function txt(cls,s){return '<div class="'+cls+(s.length>36?' long':'')+'">'+esc(s)+'</div>'}

function draw(){
  var s=SES,el=$('#session');
  if(s.i>=s.queue.length){drawResults();return}
  var n=s.queue[s.i],pt=W[n-1][0],en=W[n-1][1],h='';
  var pct=Math.round(s.ndone/s.total*100);
  h+='<div class="sess"><div class="s-top"><button class="icon" data-act="quit" aria-label="Sair da sessão">'+ICON.x+'</button><div class="s-prog"><div class="bar thick" role="img" aria-label="'+pct+'% concluído"><i class="m" style="width:'+pct+'%"></i></div></div><span class="s-count">'+s.ndone+'/'+s.total+'</span></div>';
  h+='<div class="s-mode">'+MODES[s.mode].n+'</div>';
  var ans=s.phase==='a';

  if(s.mode==='cards'){
    var dir=state.o.dir,fr=dir==='pt'?pt:en,bk=dir==='pt'?en:pt;
    h+='<div class="ticket">'+tkHead(n);
    h+='<div class="tk-zone"><div class="tk-front'+(fr.length>36?' long':'')+'" style="flex:1;min-width:0">'+esc(fr)+'</div>'+(dir==='en'?spkBtn(n,false):'')+'</div>';
    h+='<div class="perf"></div>';
    if(ans){
      h+='<div class="tk-zone"><div class="tk-back'+(bk.length>36?' long':'')+'">'+esc(bk)+'</div>'+(dir==='pt'?spkBtn(n,false):'')+'</div>';
    }else h+='<div class="tk-wait">Tente lembrar a resposta e depois confira.</div>';
    h+='</div>';
    if(!ans)h+='<button class="btn pri block" data-act="flip">Mostrar resposta</button>';
    else h+='<div class="two"><button class="btn bad" data-act="grade" data-ok="0">Errei</button><button class="btn pri" data-act="grade" data-ok="1">Acertei</button></div>';
  }else if(s.mode==='quiz'||s.mode==='listen'){
    var listen=s.mode==='listen';
    if(!s.cur)s.cur={opts:makeOptions(n,listen?0:1),pick:null};
    h+='<div class="ticket">'+tkHead(n);
    if(listen){
      h+='<div class="tk-center">'+spkBtn(n,true)+'<div class="muted" style="font-size:15px">O que o cliente disse?</div></div>';
    }else{
      h+=txt('tk-front',pt);
    }
    h+='<div class="perf"></div>';
    if(ans){
      if(listen)h+='<div class="tk-zone"><div class="tk-back'+(en.length>36?' long':'')+'">'+esc(en)+'</div></div><div class="muted" style="margin-top:4px">'+esc(pt)+'</div>';
      else h+='<div class="tk-zone"><div class="tk-back'+(en.length>36?' long':'')+'">'+esc(en)+'</div>'+spkBtn(n,false)+'</div>';
    }else h+='<div class="tk-wait">'+(listen?'Escolha o significado em português.':'Escolha a tradução em inglês.')+'</div>';
    h+='</div><div class="opts">';
    s.cur.opts.forEach(function(o,i){
      var cls='';
      if(ans){cls=o.ok?' good':(i===s.cur.pick?' wrong':' dim')}
      h+='<button class="opt'+cls+'" data-act="pick" data-i="'+i+'"'+(ans?' disabled':'')+'><span class="k">'+(i+1)+'</span><span>'+esc(o.t)+'</span></button>';
    });
    h+='</div>';
    if(ans)h+='<button class="btn pri block" data-act="next">Continuar</button>';
  }else{
    if(!s.cur)s.cur={fb:null,val:''};
    h+='<div class="ticket">'+tkHead(n)+txt('tk-front',pt)+'<div class="perf"></div>';
    if(ans)h+='<div class="tk-zone"><div class="tk-back'+(en.length>36?' long':'')+'">'+esc(en)+'</div>'+spkBtn(n,false)+'</div>';
    else h+='<div class="tk-wait">Digite em inglês.</div>';
    h+='</div>';
    if(!ans){
      h+='<input type="text" id="wr" class="ans" placeholder="Resposta em inglês" aria-label="Resposta em inglês" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">';
      h+='<div class="two"><button class="btn ghost" data-act="skip">Não sei</button><button class="btn pri" data-act="check">Verificar</button></div>';
    }else{
      var fb=s.cur.fb;
      if(fb==='ok')h+='<div class="fb ok"><b>Correto.</b></div>';
      else if(fb==='near')h+='<div class="fb near"><b>Quase.</b> Confira a grafia: '+esc(speakable(en))+'</div>';
      else h+='<div class="fb no"><b>Resposta:</b> '+esc(en)+'</div>';
      h+='<button class="btn pri block" data-act="next">Continuar</button>';
    }
  }
  h+='</div>';
  el.innerHTML=h;
  var w=$('#wr');if(w)w.focus({preventScroll:true});
  if(s.phase==='q'){
    if(s.mode==='listen')speak(en);
    else if(s.mode==='cards'&&state.o.dir==='en'&&state.o.auto)speak(en);
  }
}

function finishItem(n,ok){
  var s=SES;
  if(!s.graded[n]){
    s.graded[n]=1;s.ngraded++;
    grade(n,ok);
    if(ok)s.right++;else s.wrong.push(n);
  }
  if(!ok&&s.mode==='cards'&&!s.requeued[n]){
    s.requeued[n]=1;
    s.queue.splice(Math.min(s.i+5,s.queue.length),0,n);
  }else if(!s.done[n]){
    s.done[n]=1;s.ndone++;
  }
}
function advance(){
  SES.i++;SES.phase='q';SES.cur=null;
  draw();
  window.scrollTo(0,0);
}
function autoSpeakAnswer(n){if(state.o.auto)speak(W[n-1][1])}

function drawResults(){
  var s=SES,tot=s.ngraded,pct=tot?Math.round(s.right/tot*100):0;
  var msg=pct>=90?'Excelente. Essas palavras já estão no ponto.':pct>=70?'Bom trabalho. Revise as que errou e siga em frente.':'Faz parte. As palavras erradas voltam em breve para revisão.';
  var h='<div class="sess res"><div class="s-top"><button class="icon" data-act="quit" aria-label="Voltar">'+ICON.x+'</button></div>';
  h+='<div><div class="eyebrow">Rodada concluída</div><div class="goalrow"><span class="big">'+s.right+'</span><span class="of">de '+tot+' certas na primeira tentativa</span></div><p class="muted" style="margin:0">'+msg+'</p></div>';
  if(s.wrong.length){
    h+='<div><h2 class="sec" style="margin-top:8px">Para rever</h2>';
    s.wrong.forEach(function(n){
      h+='<div class="row"><span class="num">'+pad(n)+'</span><div class="tx"><b>'+esc(W[n-1][0])+'</b><span>'+esc(W[n-1][1])+'</span></div><div class="end">'+spkBtn(n,false)+'</div></div>';
    });
    h+='</div>';
  }
  h+='<div class="two"><button class="btn ghost" data-act="quit">Voltar</button><button class="btn pri" data-act="again">Mais uma rodada</button></div></div>';
  $('#session').innerHTML=h;
  window.scrollTo(0,0);
}

/* ---------- actions ---------- */
function pick(i){
  var s=SES;
  if(!s||s.phase!=='q'||!s.cur||!s.cur.opts||!s.cur.opts[i])return;
  s.cur.pick=i;s.phase='a';
  var n=s.queue[s.i],ok=s.cur.opts[i].ok;
  finishItem(n,ok);
  draw();
  if(s.mode==='quiz')autoSpeakAnswer(n);
}
function checkAnswer(skip){
  var s=SES,n=s.queue[s.i];
  if(s.phase!=='q')return;
  var r;
  if(skip)r='no';
  else{
    var v=($('#wr')||{}).value||'';
    r=checkWrite(n,v);
    if(r===null)return;
  }
  s.cur.fb=r;s.phase='a';
  finishItem(n,r!=='no');
  draw();
  autoSpeakAnswer(n);
}
function flip(){
  var s=SES;
  if(!s||s.mode!=='cards'||s.phase!=='q')return;
  s.phase='a';draw();
  if(state.o.dir==='pt')autoSpeakAnswer(s.queue[s.i]);
}
function gradeCard(ok){
  var s=SES;
  if(!s||s.mode!=='cards'||s.phase!=='a')return;
  finishItem(s.queue[s.i],ok);
  advance();
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.dataset.act,d=el.dataset;
  switch(a){
    case 'tab':setView(d.v);break;
    case 'go-practice':setView('practice');break;
    case 'start-home':
      if(!startSession('cards','hoje','all',20)){startSession('cards','novas','all',10)}
      break;
    case 'go-cat':
      cfg.cat=d.c;
      cfg.pool=stats(+d.c).nw>0?'novas':'tudo';
      setView('practice');break;
    case 'mode':cfg.mode=d.m;render();break;
    case 'dir':state.o.dir=d.d;persist();render();break;
    case 'goal':state.o.goal=+d.g;persist();render();break;
    case 'auto':state.o.auto=d.v==='1';persist();render();break;
    case 'slow':state.o.slow=d.v==='1';persist();render();break;
    case 'reset-ask':resetArm=true;render();break;
    case 'reset-no':resetArm=false;render();break;
    case 'reset-yes':state.s={};state.d={};resetArm=false;persist();clearTimeout(timer);flush();render();break;
    case 'start':
      if(!startSession(cfg.mode,cfg.pool,cfg.cat,20))render();
      break;
    case 'lst':L.st=d.s;L.shown=60;render();break;
    case 'more':L.shown+=60;$('#rows').innerHTML=listRows();break;
    case 'speak':speak(W[+d.n-1][1]);break;
    case 'flip':flip();break;
    case 'grade':gradeCard(d.ok==='1');break;
    case 'pick':pick(+d.i);break;
    case 'check':checkAnswer(false);break;
    case 'skip':checkAnswer(true);break;
    case 'next':if(SES&&SES.phase==='a')advance();break;
    case 'quit':endSession();break;
    case 'again':
      var m=SES.mode,p=SES.pool,c=SES.cat,z=SES.size;
      if(!startSession(m,p,c,z))endSession();
      break;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){L.q=e.target.value;L.shown=60;$('#rows').innerHTML=listRows()}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='sel-cat'){cfg.cat=e.target.value;render()}
  else if(id==='sel-pool'){cfg.pool=e.target.value;render()}
  else if(id==='lcat'){L.cat=e.target.value;L.shown=60;$('#rows').innerHTML=listRows()}
});
document.addEventListener('keydown',function(e){
  var s=SES;
  if(!s||e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key;
  if(k==='Escape'){endSession();return}
  if(s.i>=s.queue.length)return;
  var typing=e.target&&e.target.id==='wr';
  if(s.mode==='write'){
    if(k==='Enter'){e.preventDefault();if(s.phase==='q')checkAnswer(false);else advance()}
    return;
  }
  if(typing)return;
  if(s.mode==='cards'){
    if(s.phase==='q'&&(k===' '||k==='Enter')){e.preventDefault();flip()}
    else if(s.phase==='a'){
      if(k==='1'||k==='ArrowLeft'){e.preventDefault();gradeCard(false)}
      else if(k==='2'||k==='ArrowRight'||k==='Enter'||k===' '){e.preventDefault();gradeCard(true)}
    }
  }else{
    if(s.phase==='q'&&/^[1-4]$/.test(k))pick(+k-1);
    else if(s.phase==='a'&&(k==='Enter'||k===' ')){e.preventDefault();advance()}
  }
});

/* ---------- boot ---------- */
pruneDays();
render();
initSync();
})();
</script>

</body></html>
